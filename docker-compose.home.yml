services:
  libretv:
    build: .
    image: libretv-nas:local
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      PASSWORD: ${PASSWORD:?请设置 LibreTV 登录密码}
      NAS_DOWNLOAD_ENABLED: ${NAS_DOWNLOAD_ENABLED:-0}
      DOWNLOAD_DATA_DIR: /data
      NAS_HOST: ${NAS_HOST:-}
      NAS_SHARE: ${NAS_SHARE:-}
      NAS_USERNAME: ${NAS_USERNAME:-}
      NAS_PASSWORD: ${NAS_PASSWORD:-}
      NAS_DOMAIN: ${NAS_DOMAIN:-WORKGROUP}
    volumes:
      - downloads:/data
    stop_grace_period: 30s
volumes:
  downloads:
